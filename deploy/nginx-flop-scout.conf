# Flop Scout — nginx reverse proxy
# /etc/nginx/sites-available/flop-scout  (symlink into sites-enabled)
#
# Then get the certificate:
#   sudo certbot --nginx -d flopscout.com -d www.flopscout.com

server {
    listen 80;
    listen [::]:80;
    server_name flopscout.com www.flopscout.com;

    # Let certbot serve the ACME challenge over plain HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flopscout.com www.flopscout.com;

    # certbot manages these two lines
    # ssl_certificate     /etc/letsencrypt/live/flopscout.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/flopscout.com/privkey.pem;

    # FLOP answers can legitimately take up to ~200s on a congested devnet.
    # Keep this above the app's own budget so nginx is never the thing that
    # cuts the request off.
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    location /static/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
