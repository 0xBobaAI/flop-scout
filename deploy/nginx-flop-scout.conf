# Flop Scout — nginx reverse proxy
# /etc/nginx/sites-available/flop-scout  (symlink into sites-enabled)
#
# Then get the certificate:
#   sudo certbot --nginx -d flopscout.com -d www.flopscout.com

server {
    listen 80;
    listen [::]:80;
    server_name flopscout.com www.flopscout.com;

    # Let certbot serve the ACME challenge over plain HTTP (matches
    # /etc/letsencrypt/renewal/flopscout.com.conf webroot_path)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # nginx 1.18 (Ubuntu 22.04) has no `http2 on;` directive — that landed in
    # 1.25. The old way is to append http2 to the listen line below.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name flopscout.com www.flopscout.com;

    ssl_certificate     /etc/letsencrypt/live/flopscout.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/flopscout.com/privkey.pem;

    # Unwrap Cloudflare proxy IPs so rate-limiting sees the real visitor IP,
    # not Cloudflare's edge IP. Non-Cloudflare peers keep $remote_addr as-is.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # FLOP answers can legitimately take up to ~200s on a congested devnet.
    # Keep this above the app's own budget so nginx is never the thing that
    # cuts the request off.
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;

    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json text/plain;
    gzip_min_length 512;

    location /static/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
