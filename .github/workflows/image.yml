# Builds and publishes the container image that the official MCP registry and
# Glama require as a `packages` entry. The VPS is never involved: it has 1 vCPU,
# 957 MB RAM and no swap, and a build there competes with the running app for
# both memory and disk.
name: image

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish (must match version in mcp/server.json)'
        required: true
        default: '0.8.0'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      # The smoke job must test the exact artefact that was pushed, not recompute
      # the tag from the ref and risk a different answer.
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      # The registry compares this label to `name` in server.json and rejects a
      # mismatch, so it is asserted here rather than trusted to the Dockerfile.
      - name: Check the ownership label matches the published server name
        run: |
          set -e
          NAME=$(python -c "import json;print(json.load(open('mcp/server.json'))['name'])")
          VERSION=$(python -c "import json;print(json.load(open('mcp/server.json'))['version'])")
          LABEL=$(grep -oE 'io\.modelcontextprotocol\.server\.name="[^"]+"' Dockerfile | cut -d'"' -f2)
          echo "server.json name=$NAME version=$VERSION"
          echo "Dockerfile label=$LABEL"
          [ "$NAME" = "$LABEL" ] || { echo "::error::label and server.json name differ"; exit 1; }
          [ "$VERSION" = "${{ steps.tag.outputs.value }}" ] || \
            { echo "::error::server.json version $VERSION != image tag ${{ steps.tag.outputs.value }}"; exit 1; }

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          # linux/amd64 only. The registry validator pulls the manifest it is
          # pointed at; a multi-arch index adds a resolution step for no gain
          # here, since every consumer of this image runs on amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs the published image rather than a fresh local build, so a cache hit or
  # a stale layer cannot hide a defect in what consumers actually pull.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # metadata-action normalises the pushed ref to lowercase, so GITHUB_REPOSITORY
      # cannot be used as-is: ghcr.io/0xBobaAI/... is an invalid reference and the
      # pull fails before anything is tested. Derive the same form it published.
      - name: Resolve the published image reference
        id: img
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.build.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test the pushed image
        run: bash deploy/smoke-image.sh "${{ steps.img.outputs.ref }}"
